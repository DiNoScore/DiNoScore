name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  format:
    name: cargo fmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt
          profile: minimal
      - name: Format
        run: cargo fmt -- --check

  test-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: NixOS/nix-installer-action@v1
        with:
          # shell.nix impurely pulls sway from `<nixpkgs>`
          extra-conf: |
            nix-path = nixpkgs=channel:nixos-unstable
      - name: Cache ~/.cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-test-shell-dotcargo
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-test-shell-build-target
      - name: Build in shell.nix
        run: nix-shell --pure --run "cargo build --all-targets --locked"

  nix-build:
    name: nix-build (default.nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@v1
      - name: nix-build
        run: nix-build ./default.nix

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        rust:
          #- 1.51.0 # MSRV
          - stable
          #- nightly
    steps:
      - uses: actions/checkout@v1
      - uses: NixOS/nix-installer-action@v1
        with:
          # shell.nix impurely pulls sway from `<nixpkgs>`
          extra-conf: |
            nix-path = nixpkgs=channel:nixos-unstable
      - name: Setup environment (hack on Cargo)
        run: |
          mkdir -p ~/.local/bin
          cargo="cargo"
          echo "#!/bin/env bash" >> ~/.local/bin/cargo
          echo 'cmd=$(echo "'$cargo' $@")' >> ~/.local/bin/cargo
          echo 'nix-shell --run "$cmd"' >> ~/.local/bin/cargo
          chmod +x ~/.local/bin/cargo

          # Install build dependencies
          sudo apt install adwaita-icon-theme
      - name: Cache ~/.cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-test-dotcargo-${{ matrix.rust }}
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-test-build-target-${{ matrix.rust }}
      - name: build --all-targets
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --all-targets
      - name: test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --verbose

  # Builds for Windows by running the Windows Rust toolchain under wine in Nix
  windows:
    name: Windows package (nix-build windows/default.nix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            extra-experimental-features = nix-command
            require-sigs = false
            # Cache parts of the store across runs
            extra-substituters = file:///home/runner/nix-cache
      - name: Restore the binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/nix-cache
          key: nix-windows-cache-${{ github.run_id }}
          restore-keys: nix-windows-cache-
      - name: Initialise the binary cache if it is missing
        run: |
          mkdir -p ~/nix-cache
          if [ ! -e ~/nix-cache/nix-cache-info ]; then
            echo "StoreDir: /nix/store" > ~/nix-cache/nix-cache-info
          fi
      - name: nix-build
        run: nix-build windows/default.nix
      - name: Assemble the package
        run: |
          mkdir package
          cp -rL result/. package/
          chmod -R u+w package
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiNoScore-windows-${{ github.sha }}
          path: ./package
          if-no-files-found: error
      - name: Repopulate the binary cache
        if: always()
        continue-on-error: true
        run: |
          sudo rm -rf ~/nix-cache
          nix-build --no-out-link windows/default.nix \
            -A msys2 -A rust-windows -A mingw -A peldd > paths.txt || true
          if [ -e result ]; then readlink -f result >> paths.txt; fi
          sudo mkdir -p ~/nix-cache/nar
          sudo chown -R "$(id -u):$(id -g)" ~/nix-cache
          if [ -s paths.txt ]; then
            nix copy --to "file://$HOME/nix-cache" $(cat paths.txt)
          fi
      - name: Save the binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/nix-cache
          key: nix-windows-cache-${{ github.run_id }}

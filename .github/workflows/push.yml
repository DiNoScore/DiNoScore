name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  format:
    name: cargo fmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt
          profile: minimal
      - name: Format
        run: cargo fmt -- --check

  test-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: NixOS/nix-installer-action@v1
        with:
          # shell.nix impurely pulls sway from `<nixpkgs>`
          extra-conf: |
            nix-path = nixpkgs=channel:nixos-unstable
      - name: Cache ~/.cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-test-shell-dotcargo
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-test-shell-build-target
      - name: Build in shell.nix
        run: nix-shell --pure --run "cargo build --all-targets --locked"

  nix-build:
    name: nix-build (default.nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@v1
      - name: nix-build
        run: nix-build ./default.nix

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        rust:
          #- 1.51.0 # MSRV
          - stable
          #- nightly
    steps:
      - uses: actions/checkout@v1
      - uses: NixOS/nix-installer-action@v1
        with:
          # shell.nix impurely pulls sway from `<nixpkgs>`
          extra-conf: |
            nix-path = nixpkgs=channel:nixos-unstable
      - name: Setup environment (hack on Cargo)
        run: |
          mkdir -p ~/.local/bin
          cargo="cargo"
          echo "#!/bin/env bash" >> ~/.local/bin/cargo
          echo 'cmd=$(echo "'$cargo' $@")' >> ~/.local/bin/cargo
          echo 'nix-shell --run "$cmd"' >> ~/.local/bin/cargo
          chmod +x ~/.local/bin/cargo

          # Install build dependencies
          sudo apt install adwaita-icon-theme
      - name: Cache ~/.cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-test-dotcargo-${{ matrix.rust }}
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-test-build-target-${{ matrix.rust }}
      - name: build --all-targets
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --all-targets
      - name: test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --verbose

  # Builds for Windows by running the Windows Rust toolchain under wine in Nix
  windows:
    name: Windows package (nix-build windows/default.nix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cache-nix-action needs this to delete the previous run's cache
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            keep-outputs = true
            keep-derivations = true
      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-windows-${{ hashFiles('windows/**', 'npins/sources.json', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-windows-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-windows-
          purge-created: 0
          purge-primary-key: never
      - name: nix-build
        run: nix-build windows/default.nix
      - name: Assemble the package
        run: |
          mkdir package
          cp -rL result/. package/
          chmod -R u+w package
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiNoScore-windows-${{ github.sha }}
          path: ./package
          if-no-files-found: error
